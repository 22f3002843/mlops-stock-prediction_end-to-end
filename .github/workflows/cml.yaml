name: Continuous Integration & CML Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cml_run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js (Node 20)
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install CML CLI
        run: npm install -g @dvcorg/cml

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade numpy scikit-learn pandas matplotlib mlflow

      - name: Regenerate Training Data & Evaluate
        run: |
          python compute_features.py v0
          python get_training_data.py
          python train_and_evaluate.py v0
          python tune_and_register.py
          python evaluate_cml.py

      - name: Post CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 📊 CML Pipeline Evaluation Report" > report.md
          cat metrics.txt >> report.md
          echo "### 📈 Confusion Matrix" >> report.md
          cml comment create report.md --watermark-title="CML Report"
